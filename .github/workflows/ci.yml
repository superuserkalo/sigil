name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # apps/agent-host depends on vendor/tinyagent/tinyagents/typescript by path, and vendor/
      # is not checked in. Fetch and build it before pnpm resolves the workspace.
      - run: ./scripts/vendor-tinyagent.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
