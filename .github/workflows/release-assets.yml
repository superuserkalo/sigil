name: release-assets

# Builds the Linux AppImage and the macOS dmg for a published release and attaches them under
# stable names: Sigil-linux-x86_64.AppImage and Sigil-macos.dmg. Runs when a release is
# published, or by hand for an existing tag (gh workflow run release-assets.yml -f tag=vX.Y.Z).
#
# It never touches the Windows assets or the signed manifest (sigil-update.json and its .sig):
# the manifest names the Windows zip by hash, and the signing key never reaches CI. Neither file
# here is in the manifest, so the in-app updater does not offer them; players download them from
# the release page. Both are unsigned (the dmg is signed ad hoc only); see
# docs/runbooks/packaging.md.
#
# Build jobs run with a read-only token; only the two upload jobs can write to the release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach, for example v0.1.44
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check the tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Not a release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Tag matches the workspace version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the workspace version $version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust

      - name: Vendor Rune and TinyAgent
        run: |
          set -euo pipefail
          ./scripts/vendor-rune.sh
          ./scripts/vendor-tinyagent.sh

      # Ubuntu 22.04 on purpose, as in linux-build.yml: the AppImage runs on its glibc (2.35)
      # or newer.
      - name: Build the AppImage
        run: ./scripts/package-linux.sh --deps

      - name: Smoke test and stable name
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image=".scratch/package/Sigil-$version-x86_64.AppImage"
          # The CLI is a subcommand of the one binary; it needs no display.
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" cli --help > /dev/null
          mkdir -p dist
          cp "$image" dist/Sigil-linux-x86_64.AppImage
          sha256sum dist/Sigil-linux-x86_64.AppImage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: dist/Sigil-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  macos:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Check the tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Not a release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Tag matches the workspace version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the workspace version $version" >&2
            exit 1
          fi

      # The toolchain pinned in rust/rust-toolchain.toml, with both macOS targets for lipo.
      - name: Rust toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal \
            --target aarch64-apple-darwin,x86_64-apple-darwin
          # The packaging script runs cargo from the repository root, where rust-toolchain.toml
          # is not seen: make the pinned toolchain the default so both targets are found.
          rustup default "$channel"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust

      - name: Vendor Rune and TinyAgent
        run: |
          set -euo pipefail
          ./scripts/vendor-rune.sh
          ./scripts/vendor-tinyagent.sh

      - name: Build the universal app and the dmg
        run: ./scripts/package-desktop.sh universal-apple-darwin --dmg dist/Sigil-macos.dmg

      - name: Smoke test
        run: |
          set -euo pipefail
          version="${TAG#v}"
          app=".scratch/package/universal-apple-darwin-$version/Sigil.app"
          lipo "$app/Contents/MacOS/dah-desktop" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/dah-desktop" cli --help > /dev/null
          shasum -a 256 dist/Sigil-macos.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: dist/Sigil-macos.dmg
          if-no-files-found: error
          retention-days: 7

  upload-linux:
    needs: linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/Sigil-linux-x86_64.AppImage --clobber --repo "$GITHUB_REPOSITORY"

  upload-macos:
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/Sigil-macos.dmg --clobber --repo "$GITHUB_REPOSITORY"
