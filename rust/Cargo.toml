[workspace]
resolver = "3"
members = [
    "crates/deadlock-core",
    "crates/tinyagent",
    "crates/agent-host",
    "crates/dah-rs",
    "crates/desktop",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
crc32fast = "1"
flate2 = "1"
ureq = { version = "3", features = ["json", "platform-verifier"] }
clap = { version = "4", features = ["derive"] }

# Rune is pre-release. These patches mirror vendor/rune/Cargo.toml; an app that
# builds Rune must repeat them because a dependency's [patch] does not apply.
[patch.crates-io]
# UnRAR's build script checks the build machine, not the target (patches/unrar_sys/PATCH.md).
unrar_sys = { path = "patches/unrar_sys" }
wgpu-hal = { path = "../vendor/rune/vendor/wgpu-hal" }
winit = { path = "../vendor/rune/vendor/winit" }
parley_engine = { path = "../vendor/rune/vendor/parley_engine" }
accesskit_windows = { path = "../vendor/rune/vendor/accesskit_windows" }
accesskit_macos = { path = "../vendor/rune/vendor/accesskit_macos" }

# Shipped builds: one codegen unit and fat LTO (docs/runbooks/performance.md).
[profile.release]
codegen-units = 1
lto = "fat"

# Release code without fat LTO, for measuring memory and frame behaviour quickly. Ship builds
# use `release`.
[profile.fastrel]
inherits = "release"
codegen-units = 16
lto = false
incremental = true

# Debug builds: line tables for our crates and no debug info for dependencies keep
# target/debug a fraction of its size (it reached 76 GB with full debug info); backtraces still
# name files and lines.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
