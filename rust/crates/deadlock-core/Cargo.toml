[package]
name = "deadlock-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
regex.workspace = true
crc32fast.workspace = true
flate2.workspace = true
# SOCKS5 proxies (Settings > Network). ureq 3 speaks SOCKS itself; the feature adds no crate.
ureq = { workspace = true, features = ["socks-proxy"] }
# Install pipeline: sha256 for downloads and the ZIP reader. Both are already
# in the workspace lock through `dah-rs`, so this adds no new crate.
sha2 = "0.10"
# Git blob hashes for fetched performance configs. Already in the lock.
sha1 = "0.10"
getrandom = "0.3"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
# .7z and .rar mods open in process, as Deadlock Mod Manager does: no 7-Zip, WinRAR or
# unrar on PATH. sevenz-rust2 is pure Rust (Apache-2.0); unrar builds RARLAB's UnRAR source
# (freeware licence: extraction only, see THIRD_PARTY_NOTICES.md).
sevenz-rust2 = { version = "0.21", default-features = false, features = ["bzip2", "deflate", "ppmd", "zstd"] }
unrar = "0.5.8"
# Deadworks server content arrives as zstd or bzip2. Both are already in the workspace lock
# through `zip` in `dah-rs`, so this adds no new crate.
zstd = "0.13"
bzip2 = "0.5"
# Compatibility repairs after a game update decode and re-encode compiled Source 2
# resources. vpkmerge-core (MIT) already does that, and ADR 0013 makes the crate a linked
# library rather than a second binary. Pinned to a revision, bumped deliberately.
vpkmerge-core = { git = "https://github.com/Slush97/vpkmerge", rev = "df4158673f4e700b9dda4db76ed9f193440b24ba" }
# Game asset previews and swaps (game_assets.rs) decode textures and sound clips with
# morphic, the format crate vpkmerge-core already links. Same repository and revision.
morphic = { git = "https://github.com/Slush97/vpkmerge", rev = "df4158673f4e700b9dda4db76ed9f193440b24ba" }

# Windows: Steam's and Deadlock's install paths from the registry, and the fixed drives to look
# for Steam libraries on (discovery.rs). The same windows-sys the desktop app links.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Storage_FileSystem"] }
